<title>LIV Football Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a night-match scoreboard. Top bar with club + purse, tab rail, one working panel. Dark by design. */
:root{--bg:#0b1a14;--panel:#12261d;--panel2:#183226;--line:#25463a;--fg:#e8f1ea;--mute:#8fae9f;--acc:#ffb81c;--good:#4fd18b;--bad:#ff6b5b;--bronze:#cd7f32;--silver:#c4ccd4;--gold:#ffc83d;--elite:#c77dff;color-scheme:dark;
--disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--disp);letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-size:26px}h3{font-size:19px;color:var(--acc)}
button{font:inherit;cursor:pointer;background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:8px 12px;border-radius:6px}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:600}
input,select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
.wrap{max-width:960px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}
.money{font-family:var(--disp);font-size:24px;color:var(--acc)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:6px;overflow-x:auto;background:var(--panel);border-top:1px solid var(--acc);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs button{flex:1 1 0;min-width:0}a.btn{display:inline-block;background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:8px 12px;border-radius:6px}
/* lineup screen */
.lineup{display:grid;gap:12px;grid-template-columns:1fr 1fr;grid-template-areas:"mid mid" "left right" "bench bench"}
.lmid{grid-area:mid}.lleft{grid-area:left}.lright{grid-area:right}.lbench{grid-area:bench}
@media(min-width:760px){.lineup{grid-template-columns:170px 1fr 170px;grid-template-areas:"left mid right" "bench bench bench"}}
.lcol{display:flex;flex-direction:column;gap:8px}.lbox{background:var(--panel2,#14261d);border:1px solid var(--line,#25463a);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.sh{position:relative;background:none;border:0;padding:0 0 2px;display:flex;flex-direction:column;align-items:center;min-width:64px;color:#fff;cursor:pointer}
.sh .sp{position:absolute;left:0;top:0;font-size:11px;font-weight:700;opacity:.9;text-shadow:0 1px 2px #000}
.sh .sr{position:absolute;right:0;top:0;font-family:var(--disp);font-weight:700;font-size:15px;padding:0 4px;border-radius:6px;background:#000a;text-shadow:0 1px 2px #000}
.sh .sr.t-Bronze{color:#e0a56b}.sh .sr.t-Silver{color:#dfe6ec}.sh .sr.t-Gold{color:#ffd861}.sh .sr.t-Elite{color:#e3b6ff}.sh .sr.off{color:#ff5a4d}
.sh .sn{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:13px;text-shadow:0 1px 3px #000;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sh .sk{font-size:10px;opacity:.85}
.sh svg{margin-top:12px;filter:drop-shadow(0 2px 3px #0009)}.sh.empty svg{margin-top:14px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.mtile{padding:22px 10px;font-size:1.05rem;font-weight:700}
body{padding-bottom:84px}
.tabs button{white-space:nowrap}.tabs button.on{background:var(--acc);color:#1a1200;border-color:var(--acc)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{display:grid;gap:6px}
/* player cards (FC style) */
.list:has(>.fcc){grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;justify-items:center}
.fcc{position:relative;width:100%;max-width:190px;border-radius:14px 14px 22px 22px;padding:10px 10px 8px;color:#fff;overflow:hidden;border:2px solid var(--c1);background:linear-gradient(165deg,var(--c1),var(--c2) 55%,var(--c3));box-shadow:0 4px 14px #0008,inset 0 0 0 1px #ffffff22;display:flex;flex-direction:column;gap:4px;text-align:center;animation:pop .35s ease both}
.fcc::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff2e 45%,transparent 60%);pointer-events:none}
.fcc.t-Bronze{--c1:#a9692f;--c2:#6b3f1a;--c3:#2b1809}.fcc.t-Silver{--c1:#b9c2cb;--c2:#707b86;--c3:#2a3138}.fcc.t-Gold{--c1:#f2c94c;--c2:#a77f13;--c3:#3a2c05}.fcc.t-Elite{--c1:#d59bff;--c2:#7a35b8;--c3:#210a3a;box-shadow:0 4px 18px #c77dff66,inset 0 0 0 1px #ffffff33}
.fcc.t-Bronze,.fcc.t-Elite{color:#fff}.fcc.t-Gold{color:#2a1f00}.fcc.t-Silver{color:#161c22}.fcc.t-Gold .ex .mute,.fcc.t-Silver .ex .mute{color:inherit}.fcc.t-Gold .nmx,.fcc.t-Silver .nmx{border-color:#00000044}
.fcc .top{display:flex;align-items:flex-start;justify-content:space-between;min-height:84px;position:relative}
.fcc .rl{text-align:left;line-height:1}.fcc .rl .r{font-family:var(--disp);font-size:36px;font-weight:700;display:block}.fcc .rl .ps{font-size:12px;font-weight:700;letter-spacing:.08em;display:block;margin-top:2px}.fcc .rl .cl{font-size:10px;opacity:.85;letter-spacing:.06em;display:block;margin-top:3px}
.fcc .fcface{filter:drop-shadow(0 2px 4px #0008)}
.fcc .nmx{font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #ffffff44;padding-bottom:3px}
.fcc .st{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 4px;font-size:11px;padding-top:2px}.fcc .st b{font-family:var(--disp);font-size:14px;margin-right:3px}.fcc .st span{opacity:.88}
.fcc .ex{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin-top:4px;font-size:12px}.fcc .ex button{font-size:12px;padding:4px 8px}.fcc .ex .mute{opacity:.9}
.fcc .cam{position:absolute;top:6px;right:6px;z-index:2;background:#0006;border-radius:10px;padding:1px 6px;font-size:11px;cursor:pointer;color:#fff;border:0}
.fcc .inj{position:absolute;left:0;right:0;bottom:0;background:#b00020cc;font-size:11px;padding:2px;z-index:1}
.cards .fcc{width:150px}

.item{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:6px;padding:8px 10px}
.item .nm{min-width:0;flex:1 1 180px}.item small{color:var(--mute);display:block}
.ovr{font-family:var(--disp);font-size:22px;min-width:34px;text-align:center}
.pos{font-size:12px;color:var(--mute);min-width:34px}
.t-Bronze{color:var(--bronze)}.t-Silver{color:var(--silver)}.t-Gold{color:var(--gold)}.t-Elite{color:var(--elite)}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.profiles button{text-align:left;padding:12px}
.tag{font-size:11px;background:var(--acc);color:#1a1200;border-radius:3px;padding:1px 5px;margin-left:6px}
table{border-collapse:collapse;width:100%}th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:nth-child(2),td:nth-child(2){text-align:left}
.scroll{overflow-x:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:10px;text-align:center;animation:pop .35s ease both}
.card .ovr{font-size:34px}
.card.t-Bronze{border-color:var(--bronze)}.card.t-Silver{border-color:var(--silver)}.card.t-Gold{border-color:var(--gold)}.card.t-Elite{border-color:var(--elite);box-shadow:0 0 14px var(--elite)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{background:var(--panel);border:1px solid var(--acc);border-radius:10px;padding:18px;max-width:460px;width:100%;display:grid;gap:12px}
.log{font-variant-numeric:tabular-nums;display:grid;gap:3px;max-height:260px;overflow:auto}
.score{font-family:var(--disp);font-size:44px;text-align:center}
.pitch{background:repeating-linear-gradient(0deg,#1f6b3a 0 44px,#1b6235 44px 88px);border:2px solid #e8f1ea55;border-radius:10px;padding:14px 6px;display:grid;gap:14px;position:relative}
.pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:0}
.pitch::after{content:"";position:absolute;left:25%;right:25%;top:50%;height:60px;margin-top:-30px;border:2px solid #e8f1ea33;border-radius:50%;pointer-events:none}
.prow{display:flex;justify-content:space-evenly;gap:4px;position:relative;z-index:1}
.pc{flex:1 1 0;max-width:76px;min-width:0;border:2px solid var(--line);border-radius:8px 8px 14px 14px;padding:4px 2px 5px;text-align:center;cursor:pointer;color:var(--fg);font:inherit;background:linear-gradient(160deg,#2b3d34,#101e17)}
.pc{position:relative;overflow:hidden;max-width:86px;border-radius:10px 10px 18px 18px;padding:3px 2px 5px;border:2px solid var(--c1,#25463a);box-shadow:0 3px 8px #0009,inset 0 0 0 1px #ffffff22}
.pc::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff2e 45%,transparent 60%);pointer-events:none}
.pc.t-Bronze{--c1:#a9692f;--c2:#6b3f1a;--c3:#2b1809;color:#fff}.pc.t-Silver{--c1:#b9c2cb;--c2:#707b86;--c3:#2a3138;color:#161c22}.pc.t-Gold{--c1:#f2c94c;--c2:#a77f13;--c3:#3a2c05;color:#2a1f00}.pc.t-Elite{--c1:#d59bff;--c2:#7a35b8;--c3:#210a3a;color:#fff;box-shadow:0 0 12px #c77dff88,inset 0 0 0 1px #ffffff33}
.pc.t-Bronze,.pc.t-Silver,.pc.t-Gold,.pc.t-Elite{background:linear-gradient(165deg,var(--c1),var(--c2) 55%,var(--c3))}
.pc.pc .o,.pc.pc .p,.pc.pc .n{color:inherit}.pc.pc .p{opacity:.9;font-weight:700}.pc.pc .o.off{color:#ff2d1f;text-shadow:0 0 3px #fff}.pc .fc{filter:drop-shadow(0 2px 3px #0008)}.pc .n{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:12px;border-top:1px solid #ffffff44;margin-top:2px;padding-top:1px}
.pc .o{font-family:var(--disp);font-size:24px;line-height:1;color:var(--fg)}.pc .o.off{color:var(--bad)}
.pc .p{font-size:10px;letter-spacing:.06em;color:var(--mute)}
.pc .n{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.fc{display:flex;justify-content:center;margin:2px 0;line-height:0}.fc svg{border-radius:50%;background:#0006}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;max-height:55vh;overflow:auto}
.ph{font-size:12px;border:1px dashed var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--mute)}button.ph{background:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.chips button{padding:4px 10px;flex:0 0 auto}.chips button.on{background:var(--acc);color:#1a1200;border-color:var(--acc)}
.mute{color:var(--mute)}.good{color:var(--good)}.bad{color:var(--bad)}
.ovrb{text-align:center;margin-top:6px}.ovrb svg{width:64px;height:auto;display:block;margin:0 auto}.ovrb.sm svg{width:34px}.ovrb.sm{margin:0 0 0 8px;text-align:left;display:flex;align-items:center;gap:6px}
</style>
<div class="wrap" id="app"></div>
<script>
"use strict";
// ---------- storage (falls back to memory if the browser blocks it) ----------
const KEY="liv_football_web_v1";let mem=null;
function load(){try{const t=localStorage.getItem(KEY);if(t)return JSON.parse(t)}catch(e){}return mem}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncSoon()}
// ---------- online league (shared database; the page works offline without it) ----------
const ONL={cfg:null,reqs:{},appr:{},db:null,uid:null,on:false,host:false,first:true,wFirst:true,rev:0,last:{},owners:{},status:"Offline: saves in this browser only",t:null,busy:false,dirty:false};
const WKEYS=["league","world","cup","euro","ballon","scorers","playoffs"];
const worldJson=()=>{const o={np:S.profiles.filter(p=>p.npc)};WKEYS.forEach(k=>{if(S[k]!==undefined)o[k]=S[k]});return JSON.stringify(o)};
function inLeague(p){const L=S.league;return !!(L&&L.divs&&L.divs[p.div]&&L.divs[p.div].table[p.user])}
function softRender(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render()}
function adoptClub(d){let p;try{p=JSON.parse(d.json)}catch(e){return false}if(!p||!p.user)return false;if(!p.npc&&SK(p)&&(p.f1seed!==sheetHash(SK(p))||sheetLost(p))){seedSheet(p);p.formed=true}const i=S.profiles.findIndex(x=>x.user===p.user);if(i<0)S.profiles.push(p);else S.profiles[i]=p;ONL.last["c:"+p.user]=d.json;if(d.own)ONL.owners[p.user]=d.own;return true}
function adoptWorld(d){let w;try{w=JSON.parse(d.json)}catch(e){return false}WKEYS.forEach(k=>{if(w[k]!==undefined)S[k]=w[k]});if(w.np){const ids=new Set(w.np.map(x=>x.user));S.profiles=S.profiles.filter(p=>!p.npc||ids.has(p.user));for(const n of w.np){const i=S.profiles.findIndex(x=>x.user===n.user);if(i<0)S.profiles.push(n);else S.profiles[i]=n}}ONL.last.w=d.json;ONL.rev=d.rev||0;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return true}
function checkMembers(){if(!ONL.host)return;const L=S.league;if(!L||!L.divs||S.profiles.some(p=>!p.npc&&!inLeague(p))){S.league=newLeague(L?L.season:1);window._last="";syncSoon()}}
async function initOnline(){
 if(typeof claude==="undefined"||!claude.use)return;
 try{const db=await claude.use("db"),us=await claude.use("user");if(!db)return;
  ONL.db=db;ONL.uid=us&&us.id?await us.id():null;ONL.host=!!(us&&us.canEdit&&us.canEdit());ONL.on=true;ONL.status=ONL.host?"Online league: you are the host and play the match weeks":"Online league: the host plays the match weeks";
  const fail=e=>{ONL.status="Online league problem: "+(e&&e.code||"error")},tm=setTimeout(()=>{if(ONL.wFirst&&!ONL.host){ONL.status="Online league: waiting for the host to start it"}},10000);
  db.doc("world/main").onSnapshot(snap=>{clearTimeout(tm);const d=snap.exists?snap.data():null;
    if(d){if(ONL.wFirst||!(d.by&&d.by===ONL.uid)){if(adoptWorld(d))softRender()}}else if(ONL.host){syncSoon()}
    ONL.wFirst=false;checkMembers()},fail);
  db.doc("shop/stock").onSnapshot(snap=>{const d=snap.exists?snap.data():null;if(d&&Array.isArray(d.stock)&&d.by!==ONL.uid){S.stock=d.stock;ONL.last.s=JSON.stringify(d.stock);softRender()}},fail);
  db.collection("clubs").onSnapshot(snap=>{let ch=false;for(const c of snap.docChanges()){if(c.type==="removed")continue;const d=c.doc.data();if(!d)continue;if(!ONL.first&&d.by===ONL.uid)continue;if(adoptClub(d))ch=true}
    ONL.first=false;checkMembers();if(ch)softRender()},fail);
  db.doc("config/main").onSnapshot(snap=>{ONL.cfg=snap.exists?snap.data():null;softRender()},fail);
  db.collection("requests").onSnapshot(snap=>{for(const c of snap.docChanges())if(c.type!=="removed")ONL.reqs[c.doc.id]=c.doc.data();softRender()},fail);
  db.collection("approvals").onSnapshot(snap=>{let ch=false;for(const c of snap.docChanges()){if(c.type==="removed")continue;const d=c.doc.data(),id=c.doc.id;ONL.appr[id]=d;const p=me();
    if(p&&d&&d.user===p.user&&d.ok&&d.money>0){p.paid=p.paid||[];if(!p.paid.includes(id)){p.paid.push(id);p.money+=d.money;ch=true;msg="Payment approved: +"+fm(d.money)+" added to your club.";snd("reward"in SND?"reward":"buy");save()}}}
    softRender()},fail);
  syncSoon();render()}catch(e){}}
function syncSoon(){if(!ONL.on)return;clearTimeout(ONL.t);ONL.t=setTimeout(syncNow,1200)}
async function syncNow(){if(!ONL.on)return;if(ONL.busy){ONL.dirty=true;return}ONL.busy=true;
 try{const db=ONL.db,p=me(),put=async p=>{const j=JSON.stringify(p);if(j===ONL.last["c:"+p.user])return;ONL.owners[p.user]=ONL.owners[p.user]||ONL.uid;await db.doc("clubs/"+p.user).set({json:j,t:Date.now(),by:ONL.uid,own:ONL.owners[p.user]});ONL.last["c:"+p.user]=j};
  if(p&&!p.npc&&(!ONL.owners[p.user]||ONL.owners[p.user]===ONL.uid||ONL.host))await put(p);
  const sj=JSON.stringify(S.stock);if(sj!==ONL.last.s){await db.doc("shop/stock").set({stock:S.stock,t:Date.now(),by:ONL.uid});ONL.last.s=sj}
  if(ONL.host&&!ONL.wFirst){const w=worldJson();if(w!==ONL.last.w){ONL.rev++;await db.doc("world/main").set({json:w,rev:ONL.rev,t:Date.now(),by:ONL.uid});ONL.last.w=w}
   for(const q of S.profiles)if(!q.npc&&q!==p&&ONL.owners[q.user])await put(q)}
 }catch(e){ONL.status="Online league problem: "+(e&&e.code||"error")}
 ONL.busy=false;if(ONL.dirty){ONL.dirty=false;syncSoon()}}

// ---------- sound ----------
let ac=null;
function beep(seq){if(S.settings.mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;
 for(const [f,d] of seq){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);
 g.gain.setValueAtTime(.12*S.settings.vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d);t+=d*.9}}catch(e){}}
const SND={click:[[880,.05]],buy:[[660,.08],[880,.08],[1320,.16]],err:[[200,.15],[150,.2]],goal:[[392,.12],[523,.12],[659,.12],[784,.4]],
 Bronze:[[440,.2]],Silver:[[523,.1],[784,.2]],Gold:[[523,.08],[659,.08],[784,.08],[1047,.3]],Elite:[[523,.07],[659,.07],[784,.07],[1047,.07],[1319,.07],[1568,.5]],whistle:[[2800,.4]]};
const snd=n=>beep(SND[n]);
// ---------- data ----------
const CLUBS={"Real Madrid":"Courtois,G,90;Carvajal,D,84;Militao,D,85;Rudiger,D,85;Valverde,M,88;Tchouameni,M,85;Bellingham,M,90;Mbappe,F,91;Vinicius Jr,F,89;Rodrygo,F,83",
"FC Barcelona":"Joan Garcia,G,83;Kounde,D,85;Cubarsi,D,84;Araujo,D,84;Pedri,M,90;De Jong,M,86;Olmo,M,84;Raphinha,F,89;Yamal,F,90;Lewandowski,F,86",
"Manchester City":"Donnarumma,G,88;Gvardiol,D,86;Dias,D,87;Rodri,M,90;Bernardo Silva,M,87;Foden,M,86;Reijnders,M,85;Haaland,F,91;Doku,F,83;Cherki,F,83",
"Arsenal":"Raya,G,85;Saliba,D,88;Gabriel,D,86;White,D,84;Rice,M,89;Odegaard,M,87;Zubimendi,M,85;Saka,F,88;Gyokeres,F,86;Martinelli,F,83",
"Liverpool":"Alisson,G,89;Van Dijk,D,89;Konate,D,84;Szoboszlai,M,85;Mac Allister,M,85;Wirtz,M,86;Salah,F,89;Isak,F,87;Ekitike,F,84;Gakpo,F,82",
"Chelsea":"Palmer,M,87;Enzo Fernandez,M,85;Caicedo,M,84;Cucurella,D,82;Colwill,D,80;Joao Pedro,F,82;Pedro Neto,F,81;Estevao,F,80",
"Manchester United":"Onana,G,81;Lisandro Martinez,D,82;Dalot,D,80;Bruno Fernandes,M,86;Cunha,F,83;Mbeumo,F,83;Sesko,F,82",

function penWin(a,b){const x=strength(a),y=strength(b);return Math.random()<.5+(x-y)/200?a:b}
function runCup(season){const all=S.profiles.filter(p=>p.div>=1&&p.div<=3&&p.formed!==false).sort((x,y)=>strength(y)-strength(x));const n=all.length;let size=1;while(size<n)size*=2;
 let alive=all.slice(),rounds=[],notes=[];const byes=size-n;let first=true;
 while(alive.length>1){const size_=alive.length>=2?alive.length:1;let pool=alive.slice(),pass=[];
  if(first&&byes>0){pass=pool.splice(0,byes)}first=false;
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const ties=[],win=[];for(let i=0;i<pool.length;i+=2){const h=pool[i],a=pool[i+1];const m=simMatch(h,a);let w,pen=false;if(m.gh>m.ga)w=h;else if(m.ga>m.gh)w=a;else{w=penWin(h,a);pen=true}ties.push({h:h.user,a:a.user,gh:m.gh,ga:m.ga,w:w.user,pen});win.push(w)}
  const next=pass.concat(win);const c=next.length;rounds.push({name:c===1?"Final":c===2?"Semi-finals":c===4?"Quarter-finals":"Round of "+(c*2),ties,byes:pass.map(p=>p.user)});alive=next}
 const champ=alive[0],fin=rounds[rounds.length-1].ties[0],runner=S.profiles.find(p=>p.user===(fin.w===fin.h?fin.a:fin.h));
 champ.money+=30e6;addTrophy(champ,"FA Cup");if(runner)runner.money+=10e6;S.cup={season,rounds,winner:champ.user};
 if(!champ.npc)notes.push(champ.club+" won the FA Cup");return{winner:champ,notes}}

  h+=`<h3>Host: orders to approve (${pend.length})</h3>${pend.length?`<div class="list">${pend.map(([id,r])=>`<div class="item" style="display:block"><b>${r.club}</b> · ${r.money.toLocaleString()} for KES ${r.kes.toLocaleString()}<div class="mute">Order ${id.slice(-6).toUpperCase()} · code <b>${r.code}</b>. Approve only after you see this payment of KES ${r.kes.toLocaleString()} on your phone.</div><div class="row"><button class="pri" data-appr="${id}">Approve</button><button data-rej="${id}">Reject</button></div></div>`).join("")}</div>`:'<p class="mute">Nothing waiting.</p>'}`}
 return h}
async function buyBundle(i){const p=me(),b=BUNDLES[i];if(!PAY_TO||!ONL.on||!b)return;
 const id="o"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),r={user:p.user,club:p.club,by:ONL.uid,b:i,kes:b[1],money:b[0],t:Date.now()};
 try{await ONL.db.doc("requests/"+id).set(r);ONL.reqs[id]=r;msg="Order created. Send KES "+b[1].toLocaleString()+" to "+PAY_TO+", then enter the confirmation code under Your orders.";snd("buy")}catch(e){msg="Could not start the order. Try again.";snd("err")}render()}
async function sendCode(id){const el=document.querySelector('[data-code="'+id+'"]'),v=((el&&el.value)||"").replace(/[^A-Za-z0-9]/g,"").toUpperCase(),r=ONL.reqs[id];if(!r)return;if(v.length<6){msg="Enter the confirmation code from your payment message.";snd("err");return render()}
 try{const n={...r,code:v};await ONL.db.doc("requests/"+id).set(n);ONL.reqs[id]=n;msg="Thank you. The host will check the payment and add your money.";snd("buy")}catch(e){msg="Could not save the code. Try again."}render()}
async function hostBuy(kind,id){if(!ONL.host)return;const r=ONL.reqs[id];if(!r)return;try{const d={user:r.user,money:kind==="ok"?r.money:0,ok:kind==="ok",t:Date.now(),by:ONL.uid};await ONL.db.doc("approvals/"+id).set(d);ONL.appr[id]=d}catch(e){msg="Could not save that."}render()}

// ---- Bank: loans (debt) and a savings account, all in game money ----
const LOAN_RATE=.08,SAVE_RATE=.02,LATE_FEE=.05,MIN_REPAY=.2,MISS_FEE=.03;
const creditLimit=p=>30e6+20e6*(4-(p.div||2));
function bankView(p){const lim=creditLimit(p),loan=p.loan||0,sav=p.savings||0,room=Math.max(0,lim-loan);
 const amts=[5e6,10e6,25e6,50e6],btn=(kind,a,dis)=>`<button data-bank="${kind}:${a}" ${dis?"disabled":""}>${fm(a)}</button>`;
 return`<h3>Bank</h3><p class="mute">Game money only. Loans cost ${Math.round(LOAN_RATE*100)}% interest a season, added when the season ends. Savings earn ${Math.round(SAVE_RATE*100)}% a season. Your credit limit depends on your division (${fm(lim)} now). Owing more than the limit costs a ${Math.round(LATE_FEE*100)}% late fee at season end. Each season end the bank also takes a ${Math.round(MIN_REPAY*100)}% repayment from your cash. If you cannot pay it, you pay what you have and a ${Math.round(MISS_FEE*100)}% missed-payment fee is added to your debt.</p>
 <div class="item" style="display:block"><b>Cash</b> ${fm(p.money)} · <b>Debt</b> <span class="${loan?"bad":""}">${fm(loan)}</span> · <b>Savings</b> <span class="good">${fm(sav)}</span><div class="mute">Net worth ${fm(p.money+sav-loan)} · you can still borrow ${fm(room)}</div></div>
 <h3>Borrow</h3><div class="row">${amts.map(a=>btn("borrow",a,a>room)).join("")}</div>
 <h3>Repay</h3><div class="row">${amts.map(a=>btn("repay",a,!loan||p.money<Math.min(a,loan))).join("")}<button data-bank="repay:all" ${!loan||p.money<1?"disabled":""}>Repay as much as possible</button></div>
 <h3>Savings</h3><div class="row">${amts.map(a=>btn("deposit",a,p.money<a)).join("")}<button data-bank="withdraw:all" ${sav?"":"disabled"}>Withdraw all</button></div>`}
function bankAct(spec){const p=me();if(!p)return;const [k,v]=spec.split(":"),lim=creditLimit(p);p.loan=p.loan||0;p.savings=p.savings||0;let a=v==="all"?null:+v;
 if(k==="borrow"){if(p.loan+a>lim){msg="That is over your credit limit.";snd("err");return render()}p.loan+=a;p.money+=a;msg="Loan of "+fm(a)+" taken. You now owe "+fm(p.loan)+".";snd("buy")}
 else if(k==="repay"){a=a===null?Math.min(p.money,p.loan):Math.min(a,p.loan);if(a<=0||p.money<a){msg="Not enough cash.";snd("err");return render()}p.loan-=a;p.money-=a;msg="Repaid "+fm(a)+". You owe "+fm(p.loan)+".";snd("buy")}
 else if(k==="deposit"){if(p.money<a){msg="Not enough cash.";snd("err");return render()}p.money-=a;p.savings+=a;msg="Saved "+fm(a)+".";snd("buy")}
 else if(k==="withdraw"){a=p.savings;p.money+=a;p.savings=0;msg="Withdrew "+fm(a)+".";snd("buy")}
 save();render()}
function bankSeason(p){p.loan=p.loan||0;p.savings=p.savings||0;const out=[];if(p.savings>0){const i=Math.round(p.savings*SAVE_RATE);p.savings+=i;out.push("savings interest +"+fm(i))}
 if(p.loan>0){let i=Math.round(p.loan*LOAN_RATE),late=p.loan>creditLimit(p)?Math.round(p.loan*LATE_FEE):0;p.loan+=i+late;out.push("loan interest "+fm(i)+(late?" and a late fee of "+fm(late):""));
  const due=Math.round(p.loan*MIN_REPAY),paid=Math.max(0,Math.min(due,p.money));p.money-=paid;p.loan-=paid;
  if(paid<due){const f=Math.round(p.loan*MISS_FEE);p.loan+=f;out.push("repaid "+fm(paid)+" of the "+fm(due)+" due, missed-payment fee "+fm(f))}else out.push("repaid "+fm(paid))}return out}
function playDay(){const L=S.league,p=me();let mine="";snd("whistle");
 for(const d of [1,2,3]){const D=L.divs[d],games=D.rounds[L.round]||[];
  for(const [h,a] of games){const H=S.profiles.find(x=>x.user===h),A=S.profiles.find(x=>x.user===a),r=simMatch(H,A);
   const upd=(P,gf,ga)=>{const t=D.table[P.user];t.p++;t.gf+=gf;t.ga+=ga;if(gf>ga){t.w++;t.pts+=3;P.money+=10e6;if(!P.npc)P.wins++}else if(gf===ga){t.d++;t.pts++;P.money+=3e6}else t.l++;};
   upd(H,r.gh,r.ga);upd(A,r.ga,r.gh);
   L.sc=L.sc||{};for(const e of r.ev){const k=e[2]+"|"+e[1].user;L.sc[k]=(L.sc[k]||0)+1}
   for(const P of [H,A])P.squad.forEach(x=>{if(x.out>0)x.out--});
   for(const j of r.inj){const x=j.P.squad.find(q=>q.id===j.id);if(x)x.out=j.n}
   if(h===p.user||a===p.user){const evs=r.ev.map(e=>`<div>${e[0]}' ⚽ <b>${e[2]||"Goal"}</b> <span class="mute">(${e[1].club})</span></div>`).join("")||'<div class="mute">No goals.</div>';mine=`<div class="score">${H.club} ${r.gh} - ${r.ga} ${A.club}</div><div class="log">${evs}${r.inj.map(j=>`<div>🩹 <b>${j.name}</b> <span class="mute">(${j.P.club}) injured, out ${j.n} match${j.n>1?"es":""}</span></div>`).join("")}</div>`;if(r.gh+r.ga>0)setTimeout(()=>snd("goal"),300)}}}
 L.round++;window._last=mine;render()}
try{const m=(location.hash||"").match(/club=([a-z0-9_]+)/i);if(m){const q=S.profiles.find(x=>!x.npc&&x.user===m[1]);if(q&&!(ONL.on&&ONL.owners[q.user]&&ONL.owners[q.user]!==ONL.uid&&!ONL.host)){S.cur=q.user;S.last=q.user;if(q.admin)S.adm=true}}}catch(e){}
render();initOnline();
</script>
